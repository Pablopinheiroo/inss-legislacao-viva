name: Testes de qualidade do site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "data-storage.js"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "playwright.config.cjs"
      - ".github/workflows/test-site-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "data-storage.js"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "playwright.config.cjs"
      - ".github/workflows/test-site-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-and-legal:
    name: Dados, capturas e fontes oficiais
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências do monitor
        run: python -m pip install -r requirements.txt
      - name: Testar o monitor legislativo
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validar questões e vínculos com artigos
        run: python scripts/validate_question_banks.py
      - name: Auditar telas, armazenamento e segurança
        run: python scripts/check_site_quality.py
      - name: Verificar disponibilidade de links oficiais
        run: python scripts/check_official_links.py

  browser:
    name: Jogos, navegação e visualização em navegador
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: npm install
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar testes em desktop e celular
        run: npm run test:e2e
      - name: Guardar relatório e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-quality-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
