name: Monitorar legislação

on:
  push:
    branches:
      - main
    paths:
      - "data/laws.json"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/monitorar-legislacao.yml"
  workflow_dispatch:
  schedule:
    # 06:17 no horário de Brasília (UTC-3). O GitHub pode atrasar a execução.
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: monitorar-legislacao
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a versão atual da branch principal
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar o comparador
        run: python -m unittest discover -s tests -v
      - name: Consultar fontes oficiais e comparar textos
        id: monitor
        shell: bash
        run: |
          set +e
          python scripts/monitor.py
          monitor_exit_code=$?
          set -e
          echo "exit_code=$monitor_exit_code" >> "$GITHUB_OUTPUT"
          if [ "$monitor_exit_code" -ne 0 ]; then
            echo "::warning::Uma ou mais fontes oficiais não entregaram texto legal íntegro. O monitor registrou o diagnóstico e preservou as capturas anteriores."
          fi
      - name: Salvar o resultado e os diagnósticos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislacao.json data/snapshots/
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados para salvar."
          else
            git commit -m "Atualiza diagnóstico das fontes oficiais"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
