name: Monitorar legislação

on:
  workflow_dispatch:
  schedule:
    # 06:17 no horário de Brasília (UTC-3). O GitHub pode atrasar a execução.
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: monitorar-legislacao
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7.0.1
      - name: Preparar Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar o comparador
        run: python -m unittest discover -s tests -v
      - name: Consultar fontes oficiais e comparar textos
        run: python scripts/monitor.py
      - name: Salvar o resultado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislacao.json data/snapshots/
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados para salvar."
          else
            git commit -m "Atualiza monitoramento da legislação"
            git push
          fi
